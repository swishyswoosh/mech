# ESP32 DevKit V1; adjust the board setting for other hardware.
esphome:
  name: mech-gatt-proxy
  min_version: 2026.11.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

esp32_ble_tracker:
  scan_parameters:
    active: false

bluetooth_proxy:
  active: true
  connection_slots: 1
